# Governed-pipeline orchestrator (one Deployment per Jira project).
#
# File-lock constraint (.orchestrate.lock): replicas MUST stay at 1 and the
# strategy MUST be Recreate so a rolling update never runs two pollers.
#
# PROJECT is required and comes from the overlay. EXTRA_ARGS allows e.g.
# "--dry" or "--once" without touching the base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-alm-oss
  namespace: ai-alm-oss
  labels:
    app.kubernetes.io/name: ai-alm-oss
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-alm-oss
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-alm-oss
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: ai-alm-oss
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: ai-alm-oss:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          command: ["/usr/bin/tini", "--", "sh", "-lc"]
          args:
            - exec npx tsx scripts/orchestrate.mts --project="$PROJECT" ${EXTRA_ARGS:-}
          env:
            - name: PROJECT
              value: ""
            - name: EXTRA_ARGS
              value: "--workers=2 --genWorkers=2"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512 --expose-gc"
            - name: AIALM_SKILL_RUNNER
              value: subprocess
            # K8sJobSkillRunner inputs (used when AIALM_SKILL_RUNNER=k8s)
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AIALM_IMAGE
              value: ai-alm-oss:local
            - name: AIALM_ENV_SECRET
              value: ai-alm-oss-env
            - name: AIALM_DATA_PVC
              value: ai-alm-oss-data
            - name: AIALM_MODEL
              value: opencode-go/ox-alpha-free
          envFrom:
            - secretRef:
                name: ai-alm-oss-env
          volumeMounts:
            - name: data
              mountPath: /app/state
              subPath: state
            - name: data
              mountPath: /app/.work
              subPath: work
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-alm-oss-data
