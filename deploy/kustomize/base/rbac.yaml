apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-alm-oss
  namespace: ai-alm-oss
  labels:
    app.kubernetes.io/name: ai-alm-oss
---
# Minimal permissions for the orchestrator to dispatch generative steps
# as ephemeral Jobs (K8sJobSkillRunner) and read their outcome.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-alm-oss-orchestrator
  namespace: ai-alm-oss
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-alm-oss-orchestrator
  namespace: ai-alm-oss
subjects:
  - kind: ServiceAccount
    name: ai-alm-oss
    namespace: ai-alm-oss
roleRef:
  kind: Role
  name: ai-alm-oss-orchestrator
  apiGroup: rbac.authorization.k8s.io
