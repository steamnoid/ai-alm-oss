# Cloud Kubernetes overlay (EKS / GKE / AKS).
#
# Before applying, set the project-specific values below:
#   - images.newName / newTag  (or: kustomize edit set image ai-alm-oss=ghcr.io/<org>/ai-alm-oss:<tag>)
#   - Deployment PROJECT env   (which Jira project this instance polls)
#   - PVC storageClassName     (a REAL RWX class)
#
# Prereqs:
#   npm run docker:push                    # multi-arch amd64+arm64 -> your registry
#   kubectl create secret generic ai-alm-oss-env --from-env-file=.env -n ai-alm-oss
#   kubectl create secret generic aialm-opencode-auth \
#     --from-file=auth.json=~/.local/share/opencode/auth.json \
#     --from-file=account.json=~/.local/share/opencode/account.json -n ai-alm-oss
#   kubectl apply -k deploy/kustomize/overlays/cloud
#
# The shared wave working area (.work) MUST be RWX across nodes because
# generative Jobs (qa-impl → dev-impl → verify → pr) operate on the same wave
# clone sequentially. Point storageClassName at a real RWX class:
#   EKS: efs-csi   GKE: filestore-csi   AKS: azurefile-csi
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-alm-oss
resources:
  - ../../base
images:
  - name: ai-alm-oss
    newName: ghcr.io/ai-alm-oss/ai-alm-oss
    newTag: latest
patches:
  # RWX storage for the shared wave volume (multi-node).
  - target:
      kind: PersistentVolumeClaim
      name: ai-alm-oss-data
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteMany]
      - op: add
        path: /spec/storageClassName
        value: rwx-storage-class
  - target:
       kind: Deployment
       name: ai-alm-oss
     patch: |-
       - op: replace
         path: /spec/template/spec/containers/0/imagePullPolicy
         value: Always
       - op: replace
         path: /spec/template/spec/containers/0/env/0/value
         value: WELLBEINGT
       - op: replace
         path: /spec/template/spec/containers/0/env/5/value
         value: ghcr.io/ai-alm-oss/ai-alm-oss:latest
       - op: add
         path: /spec/template/spec/containers/0/env/-
         value:
           name: AIALM_OPENCODE_AUTH_SECRET
           value: aialm-opencode-auth
